name: build-redis

# Weekly rebuild of the redis image, plus pushes and manual runs. The gate
# keeps a scheduled run from rebuilding/pushing when nothing changed (no new
# commit, same base digest, no pending APT updates).
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 8 * * 2"   # Tuesday 08:20 UTC — a few hours after the base image build (04:17)
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if the gate says nothing changed"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_IMAGE: ghcr.io/crbrdocker/debian:stable   # base pulled from GHCR: Docker Hub pulls are rate-limited

jobs:
  # --------------------------------------------------------------------------
  # Lowercase the owner once (OCI rejects uppercase in image paths).
  # --------------------------------------------------------------------------
  prep:
    runs-on: ubuntu-24.04
    outputs:
      owner: ${{ steps.p.outputs.owner }}
    steps:
      - id: p
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Gate: rebuild only when something actually changed.
  # --------------------------------------------------------------------------
  gate:
    needs: prep
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.g.outputs.build }}
    env:
      GHCR_IMAGE: ghcr.io/${{ needs.prep.outputs.owner }}/redis
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: g
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -uo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "manual run with force=true — skipping gate, building"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IMAGE="${GHCR_IMAGE}:latest" VCS_REF="${{ github.sha }}" BASE_IMAGE="${BASE_IMAGE}" ./need_rebuild.sh

  # --------------------------------------------------------------------------
  # Build natively per arch and push per-arch tags.
  # --------------------------------------------------------------------------
  build:
    needs: [prep, gate]
    if: needs.gate.outputs.build == 'true'
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: amd64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
    env:
      GHCR_IMAGE: ghcr.io/${{ needs.prep.outputs.owner }}/redis
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/redis
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & push per-arch image (OCI + attestations)
        env:
          ARCH_NAME: ${{ matrix.arch.name }}
          VCS_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_digest=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{ .Manifest.Digest }}')
          tags=(-t "${GHCR_IMAGE}:latest-${ARCH_NAME}")
          [ -n "$DOCKERHUB_USERNAME" ] && tags+=(-t "${DOCKERHUB_IMAGE}:latest-${ARCH_NAME}")
          docker buildx build . -f Dockerfile \
            --platform "linux/${ARCH_NAME}" \
            "${tags[@]}" \
            --output type=image,oci-mediatypes=true,push=true \
            --attest type=provenance,mode=max \
            --attest type=sbom \
            --build-arg "IMAGE_VERSION=latest" \
            --build-arg "IMAGE_REVISION=${VCS_REF}" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "IMAGE_SOURCE=${SOURCE_URL}" \
            --build-arg "BASE_DIGEST=${base_digest}" \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}"

  # --------------------------------------------------------------------------
  # Merge the per-arch tags into :latest, per registry.
  # --------------------------------------------------------------------------
  manifest:
    needs: [prep, gate, build]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      GHCR_IMAGE: ghcr.io/${{ needs.prep.outputs.owner }}/redis
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/redis
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          push_manifest() {  # $1 = image repo
            local repo="$1"
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.description=Redis on the crbr Debian base image" \
              --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
              -t "${repo}:latest" \
              "${repo}:latest-amd64" "${repo}:latest-arm64"
          }
          push_manifest "$GHCR_IMAGE"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            push_manifest "$DOCKERHUB_IMAGE"
          fi

  # --------------------------------------------------------------------------
  # Prune untagged GHCR versions left behind by overwritten tags (multi-arch
  # aware). Docker Hub is tag-centric and self-GCs.
  # --------------------------------------------------------------------------
  cleanup:
    needs: [prep, gate, manifest]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Prune untagged GHCR versions
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: ${{ needs.prep.outputs.owner }}
          packages: redis
          delete-untagged: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Regenerate the Docker Hub overview: a short intro linking to the GitHub
  # README, a summary row per published image, and the exact version of every
  # installed package, read from each image's SBOM attestation (per arch when
  # amd64 and arm64 differ). Tags are read live from Docker Hub and grouped by
  # digest, so aliases share one section. Runs on every run, so the page always
  # matches what is live — even when nothing was rebuilt.
  # Image data is read from GHCR (same images; Docker Hub pulls are rate-
  # limited), the tag list from Docker Hub's web API (not counted as pulls).
  # --------------------------------------------------------------------------
  describe:
    needs: [prep, manifest]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      GHCR_IMAGE: ghcr.io/${{ needs.prep.outputs.owner }}/redis
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/redis
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      KEY_PACKAGES: "redis-server openssl"   # packages given their own summary column
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate overview
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          set -euo pipefail
          # imagetools inspect with retries: a registry read right after a push can
          # fail transiently, and a tag silently missing from the page is worse than
          # a failed job (the previous overview then stays up).
          inspect() {  # $1 = image ref, $2 = --format template
            local i
            for i in 1 2 3; do
              docker buildx imagetools inspect "$1" --format "$2" && return 0
              echo "inspect $1 failed (attempt $i/3)" >&2
              sleep $((i * 10))
            done
            echo "::error::could not inspect $1" >&2
            return 1
          }
          out="${RUNNER_TEMP}/hub-overview.md"
          tables="${RUNNER_TEMP}/hub-tables.md"
          {
            echo "# redis"
            echo
            echo "Minimal **redis** image built on top of the crbr Debian base (\`crbrdocker/debian:stable\`),"
            echo "multi-arch (\`amd64\` + \`arm64\`). Rebuilt weekly, but only when something changed."
            echo
            echo "**Documentation**: ${SOURCE_URL}#readme"
            echo
            echo "## Summary"
            echo
            printf '| Tags | Debian |'; for k in $KEY_PACKAGES; do printf ' %s |' "$k"; done; echo ' Built | Packages | Arches |'
            printf '| --- | --- |'; for k in $KEY_PACKAGES; do printf ' --- |'; done; echo ' --- | --- | --- |'
          } > "$out"
          {
            echo
            echo "## Installed packages"
            echo
            echo "Generated $(date -u +%Y-%m-%d) from each image's SBOM attestation. Versions that differ"
            echo "between \`amd64\` and \`arm64\` are shown per arch."
          } > "$tables"
          # Shared jq helpers: Debian packages per arch (name -> version), arch
          # comparison ignoring binNMU suffixes (+bN), upstream version (epoch
          # and Debian revision stripped).
          defs='
            def pk(p): [ .[p].SPDX.packages[]?
                         | select(any(.externalRefs[]?; .referenceLocator | startswith("pkg:deb/")))
                         | {(.name): (.versionInfo // "")} ] | add // {};
            def same(a; b): ((a // "") | sub("\\+b[0-9]+$"; "")) == ((b // "") | sub("\\+b[0-9]+$"; ""));
            def up(x): (x // "?") | sub("^[0-9]+:"; "") | sub("-[^-]*$"; "");
            def distro(p): [ .[p].SPDX.packages[]?.externalRefs[]?.referenceLocator
                             | capture("distro=debian-(?<v>[0-9.]+)").v ] | first // "?";
            pk("linux/amd64") as $a | pk("linux/arm64") as $b'
          # Published tags (per-arch -amd64/-arm64 helpers dropped), grouped by
          # digest; codename before alias names, the group holding :latest first.
          groups=$(curl -sfL "https://hub.docker.com/v2/repositories/${DOCKERHUB_IMAGE}/tags?page_size=100" \
            | jq -c '[.results[] | select(.name | test("-(amd64|arm64)$") | not)]
              | group_by(.digest)
              | map({digest: .[0].digest,
                     tags: (map(.name) | sort_by(if . == "latest" then 2 elif test("^(old)?stable$|^testing$") then 1 else 0 end, .))})
              | sort_by(if (.tags | index("latest")) then 0 else 1 end, .tags[0]) | .[]')
          while read -r g; do
            [ -n "$g" ] || continue
            ref="${GHCR_IMAGE}:$(jq -r '.tags[0]' <<<"$g")"
            title=$(jq -r '.tags | map("`:\(.)`") | join(" · ")' <<<"$g")
            sbom=$(inspect "$ref" '{{ json .SBOM }}')
            built=$(inspect "$ref" '{{ json .Image }}' \
              | jq -r '[.[] | .config.Labels["org.opencontainers.image.created"] // empty] | max // "?" | .[0:10]')
            jq -r --arg title "$title" --arg built "$built" --arg keys "$KEY_PACKAGES" "$defs"'
              | ([ $a + $b | keys[] | select(same($a[.]; $b[.]) | not) ] | length) as $n
              | "| \($title) | \(distro("linux/amd64")) | "
                + ([ $keys | splits(" +") | select(length > 0) as $k
                     | if same($a[$k]; $b[$k]) then up($a[$k] // $b[$k])
                       else "\(up($a[$k])) (amd64) · \(up($b[$k])) (arm64)" end ] | map(. + " | ") | add // "")
                + "\($built) | \($a | length) | "
                + (if $n == 0 then "✅ identical" else "⚠ \($n) packages differ" end) + " |"' <<<"$sbom" >> "$out"
            {
              echo
              echo "### ${title}"
              echo
              echo "| Package | Version |"
              echo "| --- | --- |"
              jq -r "$defs"'
                | ($a + $b | keys[]) as $n
                | if same($a[$n]; $b[$n]) then "| \($n) | `\($a[$n] // $b[$n])` |"
                  else "| \($n) | amd64 `\($a[$n] // "—")` · arm64 `\($b[$n] // "—")` ⚠ |" end' <<<"$sbom"
            } >> "$tables"
          done <<<"$groups"
          cat "$tables" >> "$out"
          echo "overview: $(wc -c < "$out") bytes (Docker Hub limit 25000)"
          cat "$out"
      - name: Push overview to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: ${{ runner.temp }}/hub-overview.md

  # --------------------------------------------------------------------------
  # Keep the schedule alive. GitHub disables cron workflows in public repos
  # after 60 days without repo activity; re-enabling via the API resets that.
  # --------------------------------------------------------------------------
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"
